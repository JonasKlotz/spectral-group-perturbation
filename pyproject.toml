[project]
name = "spectral-group-perturbation"
version = "0.1.0"
description = "Spectral group perturbation (SGP) for perturbation-based explanations of multispectral images"
requires-python = ">=3.11,<3.12"
# versions of the environment the paper results were computed with
dependencies = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "timm==0.9.16",
    "transformers==4.46.1",
    "huggingface-hub==0.36.2",
    "safetensors==0.7.0",
    "configilm==0.7.0",
    "captum==0.9.0",
    "numpy==1.26.4",
    "scipy==1.17.1",
    "scikit-image==0.26.0",
    "scikit-learn==1.9.0",
    "pandas==3.0.2",
    "pyarrow==24.0.0",
    "lmdb==2.2.0",
    "opencv-python-headless<4.12",
    "matplotlib==3.10.9",
    "tqdm==4.67.3",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
